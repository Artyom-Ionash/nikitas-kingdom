name: "Godot Web Deployment"

on:
  push:
    branches:
      - main

env:
  GODOT_VERSION: "4.6" # Версия должна совпадать с релизом на GitHub
  EXPORT_NAME: "Web"
  EXPORT_DIR: "build/web"
  ITCH_USER: ${{ vars.ITCH_USERNAME }}
  ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
  ITCH_CHANNEL: "web"

jobs:
  export-web:
    name: Web Export & Push
    runs-on: ubuntu-latest # Выполняем напрямую на хосте, без Docker!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Environment
        run: |
          mkdir -vp ${{ env.EXPORT_DIR }}
          mkdir -vp ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/
          mkdir -vp ~/godot-bin/

      - name: Install Godot Engine
        run: |
          # Скачиваем бинарник движка (всего ~60 МБ)
          curl -L "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip" -o godot.zip
          unzip godot.zip -d ~/godot-bin/
          # Создаем удобный алиас (симлинк)
          ln -s ~/godot-bin/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          rm godot.zip

      - name: Install Export Templates (Surgical)
        run: |
          # Скачиваем шаблоны
          curl -L "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz" -o templates.tpz

          # Извлекаем ТОЛЬКО веб-шаблоны и служебные файлы (экономия времени I/O)
          unzip templates.tpz "templates/web_*" "templates/version.txt" "templates/icudt_godot.dat"

          # Перемещаем на место
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/
          rm -rf templates.tpz templates

      - name: Godot Export
        run: |
          # Вызываем движок по абсолютному пути
          ~/godot-bin/godot --headless --export-release "${{ env.EXPORT_NAME }}" ${{ env.EXPORT_DIR }}/index.html

      - name: Deploy via Butler
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # 1. Распаковка и подготовка (с гарантией путей)
          unzip -q butler.zip -d bin-dist
          mv bin-dist/linux-amd64/butler ./butler
          chmod +x ./butler

          # 2. Жёсткая проверка целевых переменных перед пушем
          # Если любая из них пуста, скрипт упадет здесь, а не отправит кривой запрос
          : "${ITCH_USER:?Имя пользователя не задано}"
          : "${ITCH_GAME:?ID игры не задан}"

          # 3. Пуш с явным указанием пути к папке
          # Используем локальную переменную для предотвращения разрывов в строке
          TARGET="${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:web"

          ./butler push "${{ env.EXPORT_DIR }}" "$TARGET"
