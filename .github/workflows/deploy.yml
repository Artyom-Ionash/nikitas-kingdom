name: "Godot Web Deployment"

on:
  push:
    branches: [master, main]

env:
  ITCH_USER: ${{ vars.ITCH_USERNAME }}
  ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
  ITCH_CHANNEL: web
  EXPORT_DIR: build/web

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        godot_version: ["4.6.2"]

    container:
      image: barichello/godot-ci:${{ matrix.godot_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          # 0. Provisioning: Дооснастка среды (установка curl и unzip)
          apt-get update && apt-get install -y curl unzip

          # 1. Создаём структуру директорий (Root Binding)
          mkdir -p ~/.local/share/godot/export_templates/${{ matrix.godot_version }}.stable

          # 2. Загружаем официальные шаблоны
          curl -L https://github.com/godotengine/godot/releases/download/${{ matrix.godot_version }}-stable/Godot_v${{ matrix.godot_version }}-stable_export_templates.tpz -o templates.tpz

          # 3. Распаковываем и перемещаем в целевую область
          unzip templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${{ matrix.godot_version }}.stable/

          # 4. Очистка временной руды
          rm -rf templates.tpz templates

      - name: Build Project
        run: |
          mkdir -vp ${{ env.EXPORT_DIR }}
          # Headless экспорт — чистая функция без графического интерфейса
          godot --headless --export-release "Web" ${{ env.EXPORT_DIR }}/index.html

      - name: Install Butler (Reliable Way)
        run: |
          # Используем GitHub API для поиска прямой ссылки на релиз, если основной домен itch лежит
          apt-get update && apt-get install -y jq
          BUTLER_URL=$(curl -s https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default?raw=true | grep -o 'https://[^"]*' || echo "https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip")
          # Если основной домен не резолвится, используем зеркало на GitHub
          curl -L -4 --retry 5 --retry-delay 5 \
            -o butler.zip \
            "https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip"

          unzip butler.zip -d bin && chmod +x bin/butler

      - name: Deploy via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./bin/butler push \
            ./${{ env.EXPORT_DIR }} \
            ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:${{ env.ITCH_CHANNEL }}
