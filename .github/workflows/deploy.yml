name: "Godot Web Deployment"

on:
  push:
    branches: [master, main]

env:
  GODOT_VERSION: "4.6.2"
  ITCH_USER: ${{ vars.ITCH_USERNAME }}
  ITCH_GAME: ${{ vars.ITCH_GAME_ID }}
  ITCH_CHANNEL: web
  EXPORT_DIR: build/web

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    container:
      # Важно: используйте образ, соответствующий версии твоего проекта
      image: barichello/godot-ci:4.6.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          # 0. Provisioning: Дооснастка среды (установка curl и unzip)
          apt-get update && apt-get install -y curl unzip

          # 1. Создаём структуру директорий (Root Binding)
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable

          # 2. Загружаем официальные шаблоны
          curl -L https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz -o templates.tpz

          # 3. Распаковываем и перемещаем в целевую область
          unzip templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/

          # 4. Очистка временной руды
          rm -rf templates.tpz templates

      - name: Build Project
        run: |
          mkdir -vp ${{ env.EXPORT_DIR }}
          # Headless экспорт — чистая функция без графического интерфейса
          godot --headless --export-release "Web" ${{ env.EXPORT_DIR }}/index.html

      - name: Deploy via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d bin && chmod +x bin/butler

          ./bin/butler push \
            ./${{ env.EXPORT_DIR }} \
            ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:${{ env.ITCH_CHANNEL }}
