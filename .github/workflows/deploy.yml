name: "Godot Web Deployment"

on:
  push:
    branches:
      - main

env:
  # Используем переменные, чтобы легко обновлять версию в одном месте
  GODOT_VERSION: "4.6"
  EXPORT_NAME: "Web"
  EXPORT_DIR: "build/web"
  # Подставляем твои данные напрямую или через секреты
  ITCH_USER: "artyom-ionash"
  ITCH_GAME: "nikitas-kingdom"
  ITCH_CHANNEL: "web"

jobs:
  export-web:
    name: Web Export & Push
    runs-on: ubuntu-latest
    # Используем контейнер с уже предустановленным Godot для экономии времени
    container:
      image: barichello/godot-ci:4.6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Environment
        run: |
          # Дооснастка инструментами (Provisioning)
          apt-get update && apt-get install -y curl unzip
          # Создаем структуру (Root Binding)
          mkdir -vp ${{ env.EXPORT_DIR }}
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable

      # Добавь этот шаг ПЕРЕД установкой шаблонов
      - name: Cache Godot Templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Export Templates (Surgical)
        run: |
          curl -L https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz -o templates.tpz

          # Экстрагируем только то, что нужно для Web (включая версию и данные)
          # Это сэкономит время на операциях ввода-вывода
          unzip templates.tpz "templates/web_*" "templates/version.txt" "templates/icudt_godot.dat"

          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/

          # Мгновенная очистка
          rm -rf templates.tpz templates

      - name: Godot Export
        run: |
          # Экспортируем именно в index.html, как того требует хостинг
          godot --headless --export-release "${{ env.EXPORT_NAME }}" ${{ env.EXPORT_DIR }}/index.html

      - name: Install & Run Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Качаем Butler с зеркала GitHub для стабильности DNS
          curl -L -o butler.zip https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip
          unzip butler.zip -d bin-dist
          # Вытягиваем бинарник из вложенной папки архива
          mv bin-dist/linux-amd64/butler ./butler && chmod +x ./butler

          # Финальный пуш: чистая конкатенация без скрытых пробелов
          # Формат: ./butler push [ПАПКА] [ПОЛЬЗОВАТЕЛЬ]/[ИГРА]:[КАНАЛ]
          ./butler push ${{ env.EXPORT_DIR }} ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:${{ env.ITCH_CHANNEL }}
