name: "Godot Web Deployment"

on:
  push:
    branches:
      - main  # Запуск при пуше в основную ветку

jobs:
  export-web:
    name: Web Export & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Использование актуальной и эффективной библиотеки для экспорта вместо ручного контейнера
      - name: Godot Export
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz"
          relative_project_path: "./"
          export_preset_name: "Web"
          custom_export_path: "build/web/index.html"

      # Использование готового Action для Butler (компактнее и надежнее ручного curl)
      - name: Butler Push
        uses: josephbmanley/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: web
          ITCH_GAME: nikitas-kingdom
          ITCH_USER: artyom-ionash
          PACKAGE: build/web
